name: Build & Release Desktop App (Windows & macOS)

on:
  # GitHub Actions 画面の「Run workflow」ボタンからいつでも手動ビルド可能
  workflow_dispatch:
  # v0.2.0 のようなバージョンタグを push すると自動ビルド＆自動アップデート配信を公開
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            os_label: windows-x64
          - platform: macos-latest
            os_label: macos-arm64

    runs-on: ${{ matrix.platform }}

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rust ツールチェーン セットアップ
        uses: dtolnay/rust-toolchain@stable

      - name: Rust ビルドキャッシュ
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: npm 依存パッケージをインストール
        run: npm ci

      - name: Rust 単体テストを実行
        working-directory: src-tauri
        run: cargo test

      # タグ push 時：Tauri 公式 Action で署名付きビルド ＋ GitHub Release 公開 ＋ latest.json 自動生成
      - name: Tauri アプリをリリースビルド＆自動アップデート配信公開
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "TomboGCoder ${{ github.ref_name }}"
          releaseBody: "最新版の TomboGCoder です。アプリ内アップデートまたは下記インストーラから更新できます。"
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      # 手動実行時：署名鍵なしでも動作するよう Artifacts 向けビルドのみ実行
      - name: Tauri アプリをテストビルド (手動実行)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          CI: true
        run: npm run tauri build -- --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Windows ポータブル単体 exe をコピー
        if: matrix.os_label == 'windows-x64'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-portable
          Copy-Item src-tauri/target/release/tombo-gcoder.exe dist-portable/TomboGCoder-portable.exe

      # タグ push 時：Windows ポータブル版も Release へ追加添付
      - name: Windows ポータブル版を GitHub Release へ追加添付
        if: startsWith(github.ref, 'refs/tags/v') && matrix.os_label == 'windows-x64'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-portable/TomboGCoder-portable.exe

      - name: ビルド成果物を Artifacts へアップロード (Windows)
        if: matrix.os_label == 'windows-x64'
        uses: actions/upload-artifact@v4
        with:
          name: TomboGCoder-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            dist-portable/TomboGCoder-portable.exe
          if-no-files-found: error

      - name: ビルド成果物を Artifacts へアップロード (macOS)
        if: matrix.os_label == 'macos-arm64'
        uses: actions/upload-artifact@v4
        with:
          name: TomboGCoder-macos-arm64
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
