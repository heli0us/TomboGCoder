name: Build Desktop App (Windows & macOS)

on:
  # GitHub Actions 画面の「Run workflow」ボタンからいつでも手動ビルド可能
  workflow_dispatch:
  # v0.1.0 のようなバージョンタグを push すると自動で Release にも添付
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            os_label: windows-x64
          - platform: macos-latest
            os_label: macos-arm64

    runs-on: ${{ matrix.platform }}

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rust ツールチェーン セットアップ
        uses: dtolnay/rust-toolchain@stable

      - name: Rust ビルドキャッシュ
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: npm 依存パッケージをインストール
        run: npm ci

      - name: Rust 単体テストを実行
        working-directory: src-tauri
        run: cargo test

      - name: Tauri アプリをリリースビルド
        env:
          CI: true
        run: npm run tauri build

      - name: Windows ポータブル単体 exe をコピー
        if: matrix.os_label == 'windows-x64'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-portable
          Copy-Item src-tauri/target/release/tombo-gcoder.exe dist-portable/TomboGCoder-portable.exe

      - name: ビルド成果物を Artifacts へアップロード (Windows)
        if: matrix.os_label == 'windows-x64'
        uses: actions/upload-artifact@v4
        with:
          name: TomboGCoder-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            dist-portable/TomboGCoder-portable.exe
          if-no-files-found: error

      - name: ビルド成果物を Artifacts へアップロード (macOS)
        if: matrix.os_label == 'macos-arm64'
        uses: actions/upload-artifact@v4
        with:
          name: TomboGCoder-macos-arm64
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: タグ push 時は GitHub Release へ自動公開
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            dist-portable/TomboGCoder-portable.exe
            src-tauri/target/release/bundle/dmg/*.dmg
